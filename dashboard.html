<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TELESUPAR — Home</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #090914;
  --panel: #171526;
  --pink: #ff75c8;
  --purple: #a879ff;
  --muted: #aaa3bc;
}

body {
  min-height: 100vh;
  padding-bottom: 110px;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at 10% 0%, #392044 0%, transparent 35%),
    radial-gradient(circle at 100% 30%, #211943 0%, transparent 35%),
    var(--bg);
}

button {
  font-family: inherit;
  cursor: pointer;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 20px 17px;
}

/* HEADER */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 27px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: linear-gradient(135deg, #ff65c1, #8959ff);
  font-size: 22px;
  font-weight: bold;
  box-shadow: 0 0 20px #ff65c144;
}

.brand h2 {
  font-size: 19px;
  letter-spacing: .5px;
}

.brand small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 4px;
}

.header-btn {
  width: 42px;
  height: 42px;
  border: 1px solid #ffffff20;
  border-radius: 14px;
  background: #ffffff0d;
  color: white;
  font-size: 20px;
}

/* WELCOME */

.welcome {
  padding: 23px 20px;
  border-radius: 25px;
  background: linear-gradient(125deg, #42214c, #211c42);
  border: 1px solid #ffffff20;
  position: relative;
  overflow: hidden;
  margin-bottom: 25px;
}

.welcome:after {
  content: "✦";
  position: absolute;
  right: 20px;
  top: 15px;
  font-size: 75px;
  color: #ffffff12;
}

.welcome .tag {
  color: #ff9cda;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
}

.welcome h1 {
  font-size: 25px;
  margin: 12px 0 8px;
}

.welcome p {
  color: #d0c3df;
  font-size: 12px;
  line-height: 1.6;
  max-width: 240px;
}

/* SECTION */

.section {
  margin-top: 27px;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.section-head h3 {
  font-size: 16px;
}

.section-head a {
  color: var(--pink);
  font-size: 11px;
  text-decoration: none;
}

/* QUICK ACTIONS */

.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 11px;
}

.action {
  min-height: 112px;
  border-radius: 19px;
  border: 1px solid #ffffff18;
  background: #ffffff0c;
  color: white;
  padding: 15px 8px;
  text-align: center;
  transition: .2s;
}

.action:active {
  transform: scale(.94);
  background: #ff75c822;
}

.action .emoji {
  width: 43px;
  height: 43px;
  margin: 0 auto 10px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 21px;
  background: linear-gradient(135deg, #ff75c833, #9b72ff33);
}

.action b {
  display: block;
  font-size: 11px;
}

.action small {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 9px;
}

/* EXPLORE CARD */

.explore-card {
  padding: 19px;
  border-radius: 21px;
  border: 1px solid #ffffff18;
  background: linear-gradient(120deg, #241d3d, #251a31);
}

.explore-card h3 {
  font-size: 17px;
  margin-bottom: 7px;
}

.explore-card p {
  color: #bdb2cc;
  font-size: 11px;
  line-height: 1.6;
}

.primary-btn {
  border: none;
  margin-top: 15px;
  padding: 11px 17px;
  border-radius: 12px;
  color: white;
  font-size: 11px;
  font-weight: bold;
  background: linear-gradient(100deg, #ff65bc, #9764ff);
}

/* FEATURE ROW */

.feature-list {
  display: grid;
  gap: 11px;
}

.feature {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 15px;
  border: 1px solid #ffffff15;
  background: #ffffff09;
  border-radius: 17px;
  color: white;
  text-decoration: none;
}

.feature-icon {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  font-size: 20px;
  background: #ff75c822;
}

.feature-info {
  flex: 1;
}

.feature-info b {
  display: block;
  font-size: 12px;
}

.feature-info small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 5px;
}

.arrow {
  color: var(--pink);
  font-size: 20px;
}

.footer {
  text-align: center;
  color: #766e85;
  font-size: 10px;
  padding: 28px 0 10px;
}

/* BOTTOM NAV */

.bottom-nav {
  position: fixed;
  bottom: 13px;
  left: 12px;
  right: 12px;
  height: 76px;
  z-index: 100;
  background: rgba(255,255,255,.09);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,.19);
  border-radius: 25px;
  box-shadow: 0 10px 35px #0006, 0 0 25px #ff5ab414;
}

.nav-inner {
  height: 100%;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.nav-btn {
  flex: 1;
  height: 62px;
  margin: 5px 2px;
  border: none;
  background: transparent;
  color: #a99bad;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border-radius: 17px;
  transition: .3s;
}

.nav-icon {
  font-size: 23px;
  line-height: 25px;
}

.nav-btn span:last-child {
  font-size: 10px;
  font-weight: 600;
}

.nav-btn.active {
  color: #ff91ce;
  background: #ff69be29;
  box-shadow: 0 0 20px #ff69be26;
  transform: translateY(-3px);
}

.nav-btn:active {
  transform: scale(.91);
}

/* GROUP POPUP */

.group-modal {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: #000a;
  backdrop-filter: blur(7px);
  display: none;
  align-items: flex-end;
}

.group-modal.show {
  display: flex;
}

.group-sheet {
  width: 100%;
  padding: 13px 20px 30px;
  background: #21182df5;
  border: 1px solid #ffffff22;
  border-radius: 27px 27px 0 0;
  animation: sheetUp .3s ease;
}

@keyframes sheetUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.sheet-handle {
  width: 42px;
  height: 4px;
  border-radius: 10px;
  background: #8c718c;
  margin: 0 auto 22px;
}

.group-sheet h2 {
  font-size: 21px;
}

.group-sheet > p {
  color: #b7a6bd;
  font-size: 12px;
  margin: 7px 0 20px;
}

.group-option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 17px;
  margin-bottom: 12px;
  color: white;
  text-align: left;
  border-radius: 18px;
  background: #ffffff12;
  border: 1px solid #ffffff20;
}

.option-icon {
  font-size: 28px;
}

.option-info {
  flex: 1;
}

.option-info b {
  display: block;
  font-size: 14px;
}

.option-info small {
  display: block;
  color: #b7a6bd;
  font-size: 11px;
  margin-top: 5px;
}

.close-group {
  width: 100%;
  padding: 14px;
  border: 1px solid #ffffff18;
  border-radius: 14px;
  color: white;
  background: #ffffff12;
}

@media (min-width: 700px) {
  .container {
    padding-top: 30px;
  }
}


.social-container {
  max-width: 680px;
  margin: auto;
  padding: 0 0 110px;
}

.social-header {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 15px;
  background: rgba(12,10,23,.94);
  backdrop-filter: blur(22px);
  border-bottom: 1px solid #ffffff13;
}

.social-header .brand {
  flex-shrink: 0;
}

.social-header .brand h2 {
  font-size: 15px;
  color: white;
}

.social-header .brand small {
  color: #b8a5c5;
  font-size: 8px;
}

.social-header .logo {
  background: linear-gradient(135deg,#ff65bd,#875cff);
  box-shadow: 0 0 18px #ff65bd40;
}

.mini-search {
  flex: 1;
  min-width: 0;
  height: 37px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid #ffffff19;
  border-radius: 13px;
  background: #ffffff0d;
}

.mini-search span {
  color: #ff91ce;
  font-size: 20px;
}

.mini-search input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  color: white;
  background: transparent;
  font-size: 11px;
}

.profile-mini {
  flex-shrink: 0;
  width: 37px;
  height: 37px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ff75c8,#8c64ff);
  color: white;
  font-size: 19px;
}

.social-main {
  padding: 17px 14px;
}

.feed-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 5px 2px 13px;
}

.feed-heading h3 {
  color: white;
  font-size: 15px;
}

.feed-heading small,
.feed-heading span {
  color: #ff91ce;
  font-size: 10px;
}

.stories-section {
  margin-bottom: 20px;
}

.stories-row {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 5px 2px 12px;
  scrollbar-width: none;
}

.stories-row::-webkit-scrollbar {
  display: none;
}

.story-item {
  flex: 0 0 65px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  color: #e9dfee;
  font-size: 10px;
  cursor: pointer;
}

.story-ring {
  width: 62px;
  height: 62px;
  padding: 3px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ffb000,#ff2878,#895cff);
}

.story-avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 3px solid #100d1a;
  background: #272039;
  color: white;
  font-size: 22px;
}

.story-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.add-story-ring {
  background: #ffffff18;
  border: 1px dashed #ff91ce;
}

.composer {
  padding: 15px;
  margin-bottom: 25px;
  border: 1px solid #ffffff19;
  border-radius: 20px;
  background: linear-gradient(135deg,#21182f,#171426);
  box-shadow: 0 10px 30px #0003;
}

.composer-top {
  display: flex;
  align-items: center;
  gap: 11px;
}

.my-avatar {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: white;
  font-weight: bold;
  background: linear-gradient(135deg,#ff65bd,#875cff);
}

.composer-top input {
  width: 100%;
  height: 42px;
  padding: 0 13px;
  border: 1px solid #ffffff17;
  border-radius: 13px;
  outline: none;
  color: white;
  background: #ffffff0b;
  font-size: 12px;
}

.composer-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid #ffffff14;
}

.media-label {
  color: #ff9bd3;
  font-size: 11px;
  cursor: pointer;
}

.publish-btn {
  padding: 10px 17px;
  border-radius: 12px;
  color: white;
  background: linear-gradient(100deg,#ff65bd,#9360ff);
  font-size: 11px;
  font-weight: bold;
}

.selected-preview {
  margin-top: 10px;
  color: #c8b8d2;
  font-size: 10px;
}

.feed-tabs {
  padding-bottom: 10px;
  border-bottom: 1px solid #ffffff15;
}

.post-card {
  overflow: hidden;
  margin-bottom: 20px;
  border: 1px solid #ffffff17;
  border-radius: 20px;
  background: #171425;
}

.post-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px;
}

.post-avatar {
  width: 39px;
  height: 39px;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  color: white;
  background: linear-gradient(135deg,#ff65bd,#875cff);
}

.post-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.post-user {
  flex: 1;
  min-width: 0;
}

.post-user b {
  display: block;
  font-size: 12px;
}

.post-user small {
  color: #a99bb6;
  font-size: 10px;
}

.post-media {
  width: 100%;
  max-height: 520px;
  display: block;
  object-fit: contain;
  background: #080710;
}

.post-caption {
  padding: 12px 14px;
  color: #eee5f4;
  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.post-actions {
  display: flex;
  gap: 17px;
  padding: 0 14px 15px;
}

.post-actions button {
  color: #f5ddeb;
  background: transparent;
  font-size: 12px;
}

.post-actions button.liked {
  color: #ff5d9d;
}

.feed-empty {
  padding: 35px 15px;
  text-align: center;
  color: #a99bb6;
  font-size: 12px;
}

.story-viewer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 500;
  flex-direction: column;
  justify-content: space-between;
  padding: 25px 14px;
  background: #080710;
  color: white;
}

.story-viewer.open {
  display: flex;
}

.story-viewer-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.story-viewer-top small {
  display: block;
  margin-top: 4px;
  color: #b5a8c0;
}

.story-viewer-top button,
.story-viewer-bottom button {
  color: white;
  background: #ffffff1c;
  border-radius: 12px;
  padding: 11px;
}

.story-media {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  margin: 18px 0;
}

.story-media img,
.story-media video {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.story-caption {
  text-align: center;
  font-size: 13px;
  padding: 10px;
}

.story-viewer-bottom {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.social-toast {
  position: fixed;
  z-index: 600;
  bottom: 105px;
  left: 50%;
  transform: translateX(-50%);
  padding: 11px 17px;
  border-radius: 12px;
  color: white;
  background: #30243b;
  border: 1px solid #ffffff20;
  font-size: 11px;
  opacity: 0;
  pointer-events: none;
  transition: .2s;
}

.social-toast.show {
  opacity: 1;
}


/* HEADER CREATE + PROFILE */

.header-tools {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}

.create-open-btn {
  width: 39px;
  height: 39px;
  border: 1px solid #ffffff25;
  border-radius: 13px;
  color: white;
  font-size: 27px;
  line-height: 1;
  background: linear-gradient(135deg,#ff65bd,#875cff);
  box-shadow: 0 0 18px #ff65bd35;
}

.profile-mini {
  width: 39px;
  height: 39px;
  padding: 0;
  overflow: hidden;
  display: grid;
  place-items: center;
  border: 2px solid #ff91ce;
  border-radius: 50%;
  background: #30213f;
  color: white;
  font-size: 19px;
}

.profile-mini img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* CREATE MODAL */

.create-modal {
  position: fixed;
  inset: 0;
  z-index: 400;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: #000b;
  backdrop-filter: blur(10px);
}

.create-modal.show {
  display: flex;
}

.create-panel {
  width: 100%;
  max-width: 480px;
  padding: 17px;
  border: 1px solid #ffffff24;
  border-radius: 23px;
  background: #171425;
  box-shadow: 0 20px 60px #0008;
}

.create-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 17px;
}

.create-panel-head h3 {
  font-size: 17px;
}

.create-panel-head small {
  display: block;
  color: #b8a5c5;
  font-size: 10px;
  margin-top: 5px;
}

.create-panel-head button {
  width: 34px;
  height: 34px;
  border: 1px solid #ffffff20;
  border-radius: 10px;
  color: white;
  background: #ffffff12;
}

.create-panel .composer {
  margin: 0;
}

.education-note {
  margin-top: 13px;
  color: #c9b8d7;
  font-size: 10px;
  line-height: 1.5;
}

/* PROFILE DP IN BOTTOM NAV */

.profile-nav-avatar {
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 1.5px solid #b8a5c5;
  border-radius: 50%;
  font-size: 15px;
  line-height: 1;
}

.profile-nav-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.nav-btn.active .profile-nav-avatar {
  border-color: #ff91ce;
}
  
</style>
</head>

<body>

<div class="container social-container">

  <header class="social-header">
  <div class="brand">
    <div class="logo">TS</div>
    <div>
      <h2>TELESUPAR</h2>
      <small>LEARN • SHARE • GROW</small>
    </div>
  </div>

  <div class="header-tools">
    <button class="create-open-btn" id="createOpen" type="button">
      ＋
    </button>

    <button class="profile-mini" onclick="goTo('profile.html')"
      type="button" aria-label="My Profile">
      <span id="topProfileAvatar">◎</span>
    </button>
  </div>
</header>

  <main class="social-main">

    <section class="stories-section">
      <div class="feed-heading">
        <h3>Stories</h3>
        <small>24 hours</small>
      </div>

      <div id="storiesRow" class="stories-row">
        <div class="story-loading">Loading stories...</div>
      </div>

      <input type="file" id="storyFileInput"
        accept="image/*,video/*" hidden>
    </section>

    <section class="composer">
      <div class="composer-top">
        <div class="my-avatar" id="myAvatar">T</div>
        <input id="postCaption" maxlength="2200"
          placeholder="What's happening today?" />
      </div>

      <div id="selectedPreview" class="selected-preview"></div>

      <div class="composer-actions">
        <label class="media-label" for="postFile">
          <span>▧</span> Photo / Video
        </label>
        <input type="file" id="postFile"
          accept="image/*,video/mp4,video/webm"
          hidden>
        <button id="publishPost" class="publish-btn">
          Publish ↗
        </button>
      </div>
    </section>

    <div class="feed-heading feed-tabs">
      <h3>Community Feed</h3>
      <span>For You</span>
    </div>

    <section id="postsFeed">
      <div class="feed-empty">Loading posts...</div>
    </section>

  </main>
</div>

<!-- CREATE POST / REEL PANEL -->
<div class="create-modal" id="createModal">
  <div class="create-panel">
    <div class="create-panel-head">
      <div>
        <h3>Create Post / Reel</h3>
        <small>Share something educational</small>
      </div>
      <button type="button" id="createClose">✕</button>
    </div>

    <section class="composer">
      <div class="composer-top">
        <div class="my-avatar" id="myAvatar">T</div>
        <input id="postCaption" maxlength="2200"
          placeholder="Share your knowledge..." />
      </div>

      <div id="selectedPreview" class="selected-preview"></div>

      <div class="composer-actions">
        <label class="media-label" for="postFile">
          ▧ Photo / Video
        </label>

        <input type="file" id="postFile"
          accept="image/*,video/mp4,video/webm" hidden>

        <button id="publishPost" class="publish-btn" type="button">
          Publish ↗
        </button>
      </div>

      <p class="education-note">
        🎓 Only educational posts and videos are allowed.
      </p>
    </section>
  </div>
</div>
  
<!-- STORY VIEWER -->
<div id="storyViewer" class="story-viewer">
  <div class="story-viewer-top">
    <div>
      <b id="storyOwnerName">Story</b>
      <small id="storyOwnerTime"></small>
    </div>
    <button id="closeStory">✕</button>
  </div>

  <div id="storyMedia" class="story-media"></div>
  <div id="storyCaption" class="story-caption"></div>

  <div class="story-viewer-bottom">
    <button id="storyPrev">‹ Previous</button>
    <button id="storyLike">♡ Like</button>
    <button id="storyNext">Next ›</button>
  </div>
</div>

<div id="socialToast" class="social-toast"></div>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div class="nav-inner">

    <button class="nav-btn active" data-page="home">
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </button>

    <button class="nav-btn" data-page="chat">
      <span class="nav-icon">◉</span>
      <span>Chat</span>
    </button>

    <button class="nav-btn" data-page="explore">
      <span class="nav-icon">⌕</span>
      <span>Explore</span>
    </button>

    <button class="nav-btn" data-page="group">
      <span class="nav-icon">♧</span>
      <span>Group</span>
    </button>

    <button class="nav-btn" data-page="profile">
      <span class="nav-icon">◎</span>
      <span>Profile</span>
    </button>

  </div>
</nav>

<!-- GROUP MODAL -->
<div class="group-modal" id="groupModal">
  <div class="group-sheet">

    <div class="sheet-handle"></div>
    <h2>Community</h2>
    <p>Create your own community on TELESUPAR</p>

    <button class="group-option" onclick="openGroupPage()">
      <span class="option-icon">👥</span>
      <span class="option-info">
        <b>Create Group</b>
        <small>Chat together with your members</small>
      </span>
      <span>›</span>
    </button>

    <button class="group-option" onclick="openChannelPage()">
      <span class="option-icon">📢</span>
      <span class="option-info">
        <b>Create Channel</b>
        <small>Share updates with your audience</small>
      </span>
      <span>›</span>
    </button>

    <button class="close-group" onclick="closeGroupModal()">
      Cancel
    </button>

  </div>
</div>

<script>
function goTo(page) {
  window.location.href = page;
}

const groupModal = document.getElementById("groupModal");

function openGroupModal() {
  groupModal.classList.add("show");
}

function closeGroupModal() {
  groupModal.classList.remove("show");
}

function openGroupPage() {
  goTo("create-group.html");
}

function openChannelPage() {
  goTo("create-channel.html");
}

groupModal.addEventListener("click", function(e) {
  if (e.target === groupModal) closeGroupModal();
});

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closeGroupModal();
});

document.querySelectorAll(".nav-btn").forEach(button => {
  button.addEventListener("click", function() {
    const page = button.dataset.page;

    if (page === "group") {
      openGroupModal();
      return;
    }

    const pages = {
      home: "dashboard.html",
      chat: "home.html",
      explore: "explore.html",
      profile: "profile.html"
    };

    if (pages[page]) goTo(pages[page]);
  });
});

  
const SOCIAL_API = "https://telesupar.onrender.com";
const SOCIAL_TOKEN = localStorage.getItem("telesupar_token");

if (!SOCIAL_TOKEN) {
  location.replace("login.html");
}

const $ = id => document.getElementById(id);

function toast(message) {
  const el = $("socialToast");
  el.textContent = message;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2400);
}

function safeText(value) {
  return String(value || "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

async function socialApi(path, options = {}) {
  const headers = {
    Authorization: "Bearer " + SOCIAL_TOKEN,
    ...(options.headers || {})
  };

  if (!(options.body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
  }

  const response = await fetch(SOCIAL_API + path, {
    ...options,
    headers
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.message || "Request failed");
  }

  return data;
}

// USER PROFILE
async function loadSocialProfile() {
  try {
    const data = await socialApi("/api/me");

    if (data.user) {
      const user = data.user;
      $("myAvatar").textContent =
        (user.displayName || user.username || "T")[0].toUpperCase();

      if (user.avatar) {
        $("myAvatar").innerHTML =
          `<img src="${safeText(user.avatar)}"
          style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
      }
    }
  } catch (error) {
    toast(error.message);
  }
}

// STORIES
let storyGroups = [];
let activeStories = [];
let activeStoryIndex = 0;
let activeStoryOwner = false;

function storyAvatar(user) {
  if (user.avatar) {
    return `<img src="${safeText(user.avatar)}" alt="">`;
  }

  return safeText(
    (user.displayName || user.username || "U")[0].toUpperCase()
  );
}

async function loadSocialStories() {
  const row = $("storiesRow");

  try {
    const data = await socialApi("/api/stories/feed");
    if (!data.success) throw new Error("Stories unavailable");

    storyGroups = [
      ...(data.myStories?.length
        ? [{
            user: null,
            stories: data.myStories,
            owner: true
          }]
        : []),
      ...(data.users || []).map(group => ({
        ...group,
        owner: false
      }))
    ];

    row.innerHTML = "";

    const myItem = document.createElement("div");
    myItem.className = "story-item";

    const latest = data.myStories?.[data.myStories.length - 1];

    myItem.innerHTML = `
      <div class="story-ring ${latest ? "" : "add-story-ring"}">
        <div class="story-avatar">
          ${latest ? (latest.resourceType === "video"
            ? "▶"
            : `<img src="${safeText(latest.mediaUrl)}">`) : "+"}
        </div>
      </div>
      <span>${latest ? "My Story" : "Add Story"}</span>
    `;

    myItem.onclick = () => {
      if (latest) {
        openSocialStory(data.myStories, null, true, 0);
      } else {
        $("storyFileInput").click();
      }
    };

    row.appendChild(myItem);

    (data.users || []).forEach(group => {
      const user = group.user || {};
      const item = document.createElement("div");
      item.className = "story-item";

      item.innerHTML = `
        <div class="story-ring">
          <div class="story-avatar">${storyAvatar(user)}</div>
        </div>
        <span>${safeText(user.displayName || user.username)}</span>
      `;

      item.onclick = () =>
        openSocialStory(group.stories, user, false, 0);

      row.appendChild(item);
    });

  } catch (error) {
    row.innerHTML = `<div class="feed-empty">Stories could not load</div>`;
    console.error(error);
  }
}

function openSocialStory(list, user, owner, index) {
  activeStories = list || [];
  activeStoryIndex = index;
  activeStoryOwner = owner;
  showSocialStory(user);
}

async function showSocialStory(user) {
  const story = activeStories[activeStoryIndex];
  if (!story) return;

  $("storyOwnerName").textContent =
    user?.displayName || user?.username || "My Story";

  $("storyOwnerTime").textContent =
    new Date(story.createdAt).toLocaleString();

  $("storyCaption").textContent = story.caption || "";

  $("storyMedia").innerHTML =
    story.resourceType === "video"
      ? `<video src="${safeText(story.mediaUrl)}" controls autoplay playsinline></video>`
      : `<img src="${safeText(story.mediaUrl)}" alt="Story">`;

  $("storyLike").style.display = activeStoryOwner ? "none" : "block";
  $("storyLike").textContent = story.likedByMe ? "♥ Liked" : "♡ Like";

  $("storyViewer").classList.add("open");

  if (!activeStoryOwner) {
    try {
      await socialApi(`/api/stories/${story.id}/view`, {
        method: "POST",
        body: JSON.stringify({})
      });
    } catch (error) {
      console.error(error);
    }
  }
}

$("closeStory").onclick = () => {
  const video = $("storyMedia").querySelector("video");
  if (video) video.pause();
  $("storyViewer").classList.remove("open");
};

$("storyNext").onclick = () => {
  if (activeStoryIndex < activeStories.length - 1) {
    activeStoryIndex++;
    showSocialStory(null);
  } else {
    $("closeStory").click();
  }
};

$("storyPrev").onclick = () => {
  if (activeStoryIndex > 0) {
    activeStoryIndex--;
    showSocialStory(null);
  }
};

$("storyLike").onclick = async () => {
  const story = activeStories[activeStoryIndex];
  if (!story || activeStoryOwner) return;

  try {
    const result = await socialApi(
      `/api/stories/${story.id}/like`,
      {
        method: "POST",
        body: JSON.stringify({})
      }
    );

    story.likedByMe = result.liked;
    $("storyLike").textContent = result.liked ? "♥ Liked" : "♡ Like";
  } catch (error) {
    toast(error.message);
  }
};

// UPLOAD STORY
$("storyFileInput").addEventListener("change", async () => {
  const file = $("storyFileInput").files[0];
  if (!file) return;

  if (!file.type.startsWith("image/") &&
      !file.type.startsWith("video/")) {
    toast("Choose a photo or video");
    return;
  }

  if (file.size > 25 * 1024 * 1024) {
    toast("Maximum size is 25 MB");
    return;
  }

  const form = new FormData();
  form.append("file", file);
  form.append("caption", prompt("Story caption?") || "");

  try {
    toast("Uploading story...");
    await socialApi("/api/stories", {
      method: "POST",
      body: form
    });
    await loadSocialStories();
    toast("Story uploaded!");
  } catch (error) {
    toast(error.message);
  } finally {
    $("storyFileInput").value = "";
  }
});

// POSTS FEED
async function loadSocialPosts() {
  const feed = $("postsFeed");
  feed.innerHTML = `<div class="feed-empty">Loading posts...</div>`;

  try {
    const data = await socialApi("/api/posts/feed");
    const posts = data.posts || [];

    if (!posts.length) {
      feed.innerHTML = `
        <div class="feed-empty">
          ✨<br><br>
          No posts yet.<br>
          Be the first to share something!
        </div>`;
      return;
    }

    feed.innerHTML = "";

    posts.forEach(post => {
      const user = post.user || {};
      const card = document.createElement("article");
      card.className = "post-card";

      const avatar = user.avatar
        ? `<img src="${safeText(user.avatar)}">`
        : safeText((user.displayName || "U")[0].toUpperCase());

      let media = "";

      if (post.mediaUrl && post.mediaType === "video") {
        media = `<video class="post-media"
          src="${safeText(post.mediaUrl)}"
          controls playsinline preload="metadata"></video>`;
      } else if (post.mediaUrl) {
        media = `<img class="post-media"
          src="${safeText(post.mediaUrl)}" alt="Post">`;
      }

      card.innerHTML = `
        <div class="post-head">
          <div class="post-avatar">${avatar}</div>
          <div class="post-user">
            <b>${safeText(user.displayName || user.username)}</b>
            <small>@${safeText(user.username || "")} ·
            ${new Date(post.createdAt).toLocaleDateString()}</small>
          </div>
        </div>

        ${media}

        ${post.caption
          ? `<div class="post-caption">${safeText(post.caption)}</div>`
          : ""}

        <div class="post-actions">
          <button class="${post.likedByMe ? "liked" : ""}"
            data-like="${safeText(post.id)}">
            ${post.likedByMe ? "♥" : "♡"}
            <span>${post.likesCount || 0}</span> Likes
          </button>
          <button type="button" disabled>Comment · Coming soon</button>
          <button type="button"
            data-share="${safeText(post.id)}">↗ Share</button>
        </div>
      `;

      feed.appendChild(card);
    });

    feed.querySelectorAll("[data-like]").forEach(button => {
      button.onclick = async () => {
        try {
          const result = await socialApi(
            `/api/posts/${button.dataset.like}/like`,
            {
              method: "POST",
              body: JSON.stringify({})
            }
          );

          button.classList.toggle("liked", result.liked);
          button.innerHTML =
            `${result.liked ? "♥" : "♡"}
            <span>${result.likesCount}</span> Likes`;
        } catch (error) {
          toast(error.message);
        }
      };
    });

    feed.querySelectorAll("[data-share]").forEach(button => {
      button.onclick = async () => {
        const url = location.href + "#post-" + button.dataset.share;

        if (navigator.share) {
          try {
            await navigator.share({
              title: "TELESUPAR Post",
              url
            });
          } catch (error) {
            if (error.name !== "AbortError") toast("Share failed");
          }
        } else {
          await navigator.clipboard.writeText(url);
          toast("Link copied");
        }
      };
    });

  } catch (error) {
    feed.innerHTML = `<div class="feed-empty">Posts could not load. Please refresh.</div>`;
    toast(error.message);
  }
}

// SELECT POST PHOTO / VIDEO
$("postFile").onchange = () => {
  const file = $("postFile").files[0];
  $("selectedPreview").textContent = file
    ? "Selected: " + file.name
    : "";
};

// PUBLISH POST
$("publishPost").onclick = async () => {
  const file = $("postFile").files[0];
  const caption = $("postCaption").value.trim();

  if (!file && !caption) {
    toast("Write something or choose a photo/video");
    return;
  }

  if (file && file.size > 25 * 1024 * 1024) {
    toast("Maximum file size is 25 MB");
    return;
  }

  const form = new FormData();
  if (file) form.append("file", file);
  form.append("caption", caption);

  const button = $("publishPost");
  button.disabled = true;
  button.textContent = "Publishing...";

  try {
    await socialApi("/api/posts", {
      method: "POST",
      body: form
    });

    $("postCaption").value = "";
    $("postFile").value = "";
    $("selectedPreview").textContent = "";

    await loadSocialPosts();
    toast("Your post is published!");
  } catch (error) {
    toast(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Publish ↗";
  }
};

// SEARCH
$("feedSearch").onsubmit = event => {
  event.preventDefault();
  const query = $("topSearch").value.trim();
  if (query) {
    location.href = "explore.html?search=" + encodeURIComponent(query);
  }
};

// START
async function initSocialDashboard() {
  await loadSocialProfile();
  await Promise.all([
    loadSocialStories(),
    loadSocialPosts()
  ]);
}

initSocialDashboard();

</script>

</body>
</html>
