<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TELESUPAR — Chats</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root{
      --bg:#080b12;
      --panel:#10141d;
      --panel2:#151a24;
      --border:#252b38;
      --text:#f5f7fb;
      --muted:#8d96a8;
      --accent:#4f8cff;
      --accent2:#7c5cff;
      --danger:#ff5364;
      --success:#35d49a;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top right,rgba(79,140,255,.12),transparent 32%),
        radial-gradient(circle at bottom left,rgba(124,92,255,.08),transparent 30%),
        var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
      overflow-x:hidden;
    }

    button,input{
      font:inherit;
    }

    button{
      border:0;
      cursor:pointer;
    }

    /* HEADER */

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 17px;
      background:rgba(8,11,18,.88);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;
    }

    .logo{
      width:43px;
      height:43px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:17px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 8px 25px rgba(79,140,255,.25);
    }

    .brand-text h1{
      font-size:18px;
      letter-spacing:.5px;
    }

    .brand-text p{
      margin-top:3px;
      color:var(--muted);
      font-size:11px;
    }

    .header-btn{
      width:42px;
      height:42px;
      border-radius:13px;
      background:var(--panel2);
      color:white;
      border:1px solid var(--border);
      font-size:19px;
    }

    /* MAIN */

    .main{
      max-width:760px;
      margin:auto;
      padding:17px 15px 100px;
    }

    /* SEARCH */

    .search-box{
      position:relative;
      margin-bottom:20px;
    }

    .search-box span{
      position:absolute;
      left:15px;
      top:50%;
      transform:translateY(-50%);
      color:var(--muted);
      font-size:18px;
    }

    #searchInput{
      width:100%;
      height:51px;
      padding:0 15px 0 46px;
      border-radius:16px;
      border:1px solid var(--border);
      outline:none;
      color:white;
      background:rgba(18,23,33,.9);
    }

    #searchInput:focus{
      border-color:rgba(79,140,255,.7);
      box-shadow:0 0 0 3px rgba(79,140,255,.08);
    }

    /* SECTION */

    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:4px 3px 11px;
    }

    .section-title h2{
      font-size:15px;
    }

    .section-title span{
      font-size:11px;
      color:var(--muted);
    }

    /* CHAT LIST */

    .list{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .chat{
      display:flex;
      align-items:center;
      gap:13px;
      padding:12px;
      min-height:72px;
      border:1px solid transparent;
      border-radius:17px;
      background:rgba(16,20,29,.82);
      transition:.2s;
    }

    .chat:active{
      transform:scale(.985);
    }

    .chat:hover{
      background:var(--panel2);
      border-color:var(--border);
    }

    .avatar{
      position:relative;
      flex-shrink:0;
      width:50px;
      height:50px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      color:white;
      background:linear-gradient(135deg,#304f9c,#7449b9);
    }
    
    .avatar.avatar-fallback::after {
    content: attr(data-initial);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-weight: 800;
    color: white;
    }

    .online-dot{
      position:absolute;
      right:-2px;
      bottom:-2px;
      width:13px;
      height:13px;
      border-radius:50%;
      background:var(--success);
      border:3px solid var(--panel);
    }

    .chat-info{
      min-width:0;
      flex:1;
    }

    .chat-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .chat-name{
      font-size:14px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .chat-time{
      color:var(--muted);
      font-size:10px;
      white-space:nowrap;
    }

    .chat-bottom{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-top:7px;
    }

    .chat-message{
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .badge{
      min-width:20px;
      height:20px;
      padding:0 6px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:10px;
      background:var(--accent);
      color:white;
      font-size:10px;
      font-weight:bold;
    }

    /* SEARCH RESULTS */

    #searchResults{
      display:none;
      margin-bottom:20px;
    }

    .user-result{
      display:flex;
      align-items:center;
      gap:13px;
      padding:13px;
      border-radius:17px;
      background:var(--panel);
      border:1px solid var(--border);
      margin-bottom:8px;
    }

    .user-result-info{
      flex:1;
      min-width:0;
    }

    .user-result-name{
      font-weight:bold;
      font-size:14px;
    }

    .user-result-username{
      margin-top:4px;
      color:var(--muted);
      font-size:11px;
    }

    .chat-btn{
      padding:9px 13px;
      border-radius:11px;
      background:var(--accent);
      color:white;
      font-size:11px;
      font-weight:bold;
    }

    .chat-btn:active{
      transform:scale(.95);
    }

    /* EMPTY / LOADING */

    .center-message{
      text-align:center;
      padding:45px 20px;
      color:var(--muted);
      font-size:13px;
    }

    .loader{
      width:27px;
      height:27px;
      margin:0 auto 12px;
      border:3px solid rgba(255,255,255,.1);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    /* FAB */

    .fab{
      position:fixed;
      right:19px;
      bottom:82px;
      z-index:30;
      width:57px;
      height:57px;
      border-radius:18px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:white;
      font-size:25px;
      box-shadow:0 12px 35px rgba(79,140,255,.3);
    }

    /* BOTTOM NAV */

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:25;
      height:67px;
      display:flex;
      justify-content:center;
      background:rgba(10,13,20,.94);
      backdrop-filter:blur(20px);
      border-top:1px solid rgba(255,255,255,.07);
    }

    .nav-inner{
      width:100%;
      max-width:760px;
      display:flex;
      justify-content:space-around;
    }

    .nav-btn{
      width:25%;
      background:transparent;
      color:var(--muted);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      font-size:20px;
    }

    .nav-btn span{
      font-size:9px;
      font-weight:600;
    }

    .nav-btn.active{
      color:var(--accent);
    }

    /* TOAST */

    .toast{
      position:fixed;
      left:50%;
      bottom:83px;
      z-index:100;
      transform:translate(-50%,20px);
      opacity:0;
      pointer-events:none;
      padding:11px 16px;
      border-radius:12px;
      background:#202735;
      border:1px solid var(--border);
      color:white;
      font-size:12px;
      transition:.25s;
      white-space:nowrap;
      max-width:90%;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    @media(min-width:700px){

      .main{
        padding-top:25px;
      }

      .bottom-nav{
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:min(760px,100%);
        border-radius:18px 18px 0 0;
      }

      .fab{
        right:calc((100% - 720px)/2);
      }

    }

  <script>

    /* =================================
       TELESUPAR HOME CONFIG
    ================================= */

    const API_URL =
      "https://telesupar.onrender.com";


    /* =================================
       AUTH
    ================================= */

    const token =
      localStorage.getItem(
        "telesupar_token"
      );

    if(!token){

      window.location.replace(
        "login.html"
      );

    }


    /* =================================
       ELEMENTS
    ================================= */

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const searchResults =
      document.getElementById(
        "searchResults"
      );

    const usersList =
      document.getElementById(
        "usersList"
      );

    const chatList =
      document.getElementById(
        "chatList"
      );

    const welcomeText =
      document.getElementById(
        "welcomeText"
      );

    const chatCount =
      document.getElementById(
        "chatCount"
      );

    const toast =
      document.getElementById(
        "toast"
      );


    /* =================================
       TOAST
    ================================= */

    function showToast(message){

      toast.textContent =
        message;

      toast.classList.add(
        "show"
      );

      setTimeout(() => {

        toast.classList.remove(
          "show"
        );

      },2500);

    }


    /* =================================
       API HELPER
    ================================= */

    async function api(
      path,
      options = {}
    ){

      const headers = {

        "Content-Type":
          "application/json",

        "Authorization":
          "Bearer " + token,

        ...(options.headers || {})

      };


      let response;

      try{

        response =
          await fetch(
            API_URL + path,
            {
              ...options,
              headers
            }
          );

      }catch(error){

        throw new Error(
          "Could not connect to server"
        );

      }


      let data = {};

      try{

        data =
          await response.json();

      }catch(error){

        throw new Error(
          "Server returned invalid response"
        );

      }


      if(!response.ok){

        throw new Error(
          data.message ||
          "Request failed"
        );

      }


      return data;

    }

/* =================================
   STORIES FEED + UPLOAD
================================= */

const storiesRow = document.getElementById("storiesRow");
const addStoryBtn = document.getElementById("addStoryBtn");
const storyFileInput = document.getElementById("storyFileInput");

let myStories = [];
let otherStories = [];

function storyAvatar(user) {
  const name = user.displayName || user.username || "User";
  const initial = escapeHTML(name.charAt(0).toUpperCase());

  if (user.avatar && /^https?:\/\//i.test(user.avatar)) {
    return `<img src="${escapeHTML(user.avatar)}"
      alt="${escapeHTML(name)}"
      style="width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid var(--bg);"
      onerror="this.style.display='none';">`;
  }

  return initial;
}


function renderStories(data) {
  myStories = data.myStories || [];
  otherStories = data.users || [];
  storiesRow.innerHTML = "";

  const myItem = document.createElement("div");
  myItem.className = "story-item";

  const latestMyStory = myStories[myStories.length - 1];

  myItem.innerHTML = `
    <div class="story-ring ${latestMyStory ? "" : "add-story-ring"}">
      <div class="story-avatar" style="overflow:hidden;">
        ${
          latestMyStory
            ? latestMyStory.resourceType === "video"
              ? "▶"
              : `<img src="${escapeHTML(latestMyStory.mediaUrl)}"
                   style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
            : "＋"
        }
      </div>
    </div>
    <span>${latestMyStory ? "My Story" : "Add Story"}</span>
  `;

  myItem.addEventListener("click", () => {
    if (myStories.length) {
      openStoryGroup(myStories, true, null, 0);
    } else {
      storyFileInput.click();
    }
  });

  storiesRow.appendChild(myItem);

  otherStories.forEach(group => {
    const user = group.user || {};
    const name = user.displayName || user.username || "User";

    const item = document.createElement("div");
    item.className = "story-item";

    item.innerHTML = `
      <div class="story-ring">
        <div class="story-avatar">${storyAvatar(user)}</div>
      </div>
      <span>${escapeHTML(name)}</span>
    `;

    item.addEventListener("click", () => {
      openStoryGroup(group.stories || [], false, user, 0);
    });

    storiesRow.appendChild(item);
  });
}

async function loadStories() {
  try {
    const data = await api("/api/stories/feed");

    if (!data.success) {
      throw new Error(data.message || "Could not load stories");
    }

    renderStories(data);
  } catch (error) {
    console.error("STORIES FEED ERROR:", error);
    storiesRow.innerHTML = `
      <div class="story-loading">
        Stories could not load. Tap refresh.
      </div>
    `;
    showToast(error.message);
  }
}

/* =================================
   FULL SCREEN STORY VIEWER
================================= */

const storyViewer = document.getElementById("storyViewer");
const storyMediaContainer = document.getElementById("storyMediaContainer");
const viewerName = document.getElementById("viewerName");
const viewerAvatar = document.getElementById("viewerAvatar");
const viewerTime = document.getElementById("viewerTime");
const viewerCaption = document.getElementById("viewerCaption");
const storyLikeBtn = document.getElementById("storyLikeBtn");
const ownerStoryStats = document.getElementById("ownerStoryStats");
const storyViewsCount = document.getElementById("storyViewsCount");
const storyViewersPanel = document.getElementById("storyViewersPanel");
const storyViewersList = document.getElementById("storyViewersList");

let activeStoryList = [];
let activeStoryIndex = 0;
let activeStoryOwner = false;
let activeStoryUser = null;
let currentStory = null;

function openStoryGroup(list, isOwner, user, index = 0) {
  if (!list || !list.length) return;

  activeStoryList = list;
  activeStoryIndex = index;
  activeStoryOwner = isOwner;
  activeStoryUser = user;

  storyViewer.style.display = "flex";
  showCurrentStory();
}

async function showCurrentStory() {
  currentStory = activeStoryList[activeStoryIndex];

  if (!currentStory) return;

  storyViewersPanel.style.display = "none";
  storyMediaContainer.innerHTML = "";

  const user = activeStoryUser || {};
  const name = user.displayName || user.username || "You";

  viewerName.textContent = name;
  viewerAvatar.textContent = name.charAt(0).toUpperCase();

  if (user.avatar) {
    viewerAvatar.innerHTML = `
      <img src="${escapeHTML(user.avatar)}" alt="">
    `;
  }

  viewerTime.textContent = currentStory.createdAt
    ? new Date(currentStory.createdAt).toLocaleString()
    : "Just now";

  viewerCaption.textContent = currentStory.caption || "";

  ownerStoryStats.style.display = activeStoryOwner ? "flex" : "none";
  storyLikeBtn.style.display = activeStoryOwner ? "none" : "block";

  storyLikeBtn.textContent = currentStory.likedByMe ? "♥" : "♡";
  storyViewsCount.textContent = currentStory.viewsCount || 0;

  const media = document.createElement(
    currentStory.resourceType === "video" ? "video" : "img"
  );

  media.src = currentStory.mediaUrl;

  if (currentStory.resourceType === "video") {
    media.controls = true;
    media.autoplay = true;
    media.playsInline = true;
  } else {
    media.alt = "Story";
  }

  storyMediaContainer.appendChild(media);

  document.getElementById("storyProgress").style.width = "100%";

  try {
    const result = await api(
      `/api/stories/${currentStory.id}/view`,
      {
        method: "POST",
        body: JSON.stringify({})
      }
    );

    if (result.viewsCount !== undefined) {
      currentStory.viewsCount = result.viewsCount;
      storyViewsCount.textContent = result.viewsCount;
    }
  } catch (error) {
    console.error("STORY VIEW ERROR:", error);
  }
}

function closeStoryViewer() {
  const video = storyMediaContainer.querySelector("video");
  if (video) video.pause();

  storyViewer.style.display = "none";
  storyMediaContainer.innerHTML = "";
  storyViewersPanel.style.display = "none";
}

function nextStory() {
  if (activeStoryIndex < activeStoryList.length - 1) {
    activeStoryIndex++;
    showCurrentStory();
  } else {
    closeStoryViewer();
  }
}

function previousStory() {
  if (activeStoryIndex > 0) {
    activeStoryIndex--;
    showCurrentStory();
  }
}

document.getElementById("closeStoryViewer")
  .addEventListener("click", closeStoryViewer);

document.getElementById("nextStory")
  .addEventListener("click", nextStory);

document.getElementById("prevStory")
  .addEventListener("click", previousStory);

storyLikeBtn.addEventListener("click", async () => {
  if (!currentStory || activeStoryOwner) return;

  try {
    const result = await api(
      `/api/stories/${currentStory.id}/like`,
      {
        method: "POST",
        body: JSON.stringify({})
      }
    );

    currentStory.likedByMe = result.liked;
    currentStory.likesCount = result.likesCount;

    storyLikeBtn.textContent = result.liked ? "♥" : "♡";

    showToast(result.liked ? "Story liked!" : "Like removed");

  } catch (error) {
    showToast(error.message);
  }
});

document.getElementById("deleteMyStory")
  .addEventListener("click", async () => {
    if (!currentStory || !activeStoryOwner) return;

    if (!confirm("Delete this Story permanently?")) return;

    try {
      await api(`/api/stories/${currentStory.id}`, {
        method: "DELETE"
      });

      showToast("Story deleted");

      activeStoryList.splice(activeStoryIndex, 1);

      if (!activeStoryList.length) {
        closeStoryViewer();
      } else {
        activeStoryIndex = Math.min(
          activeStoryIndex,
          activeStoryList.length - 1
        );
        showCurrentStory();
      }

      await loadStories();

    } catch (error) {
      showToast(error.message);
    }
  });

  .addEventListener("click", async () => {
    if (!currentStory || !activeStoryOwner) return;

    try {
      const data = await api(

`;

row.querySelector(".viewer-message-btn")

        storyViewersList.appendChild(row);

document.getElementById("closeViewersPanel")

  });

    
addStoryBtn.addEventListener("click", () => {

});

storyFileInput.addEventListener("change", async () => {
  const file = storyFileInput.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/") &&
      !file.type.startsWith("video/")) {
    showToast("Only photos and videos are allowed");
    storyFileInput.value = "";
    return;
  }

  if (file.size > 25 * 1024 * 1024) {
    showToast("Maximum story size is 25 MB");
    storyFileInput.value = "";
    return;
  }

  const caption = prompt("Write a story caption (optional):") || "";

  const formData = new FormData();
  formData.append("file", file);
  formData.append("caption", caption.slice(0, 200));

  try {
    showToast("Uploading your Story...");

    const response = await fetch(API_URL + "/api/stories", {
      method: "POST",
      headers: {
        Authorization: "Bearer " + token
      },
      body: formData
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "Story upload failed");
    }

    showToast("Story uploaded successfully!");
    await loadStories();

  } catch (error) {
    console.error("STORY UPLOAD ERROR:", error);
    showToast(error.message);
  } finally {
    storyFileInput.value = "";
  }
});

    /* =================================
       FORMAT TIME
    ================================= */

    function formatTime(
      date
    ){

      if(!date){
        return "";
      }


      const d =
        new Date(date);


      if(
        isNaN(
          d.getTime()
        )
      ){

        return "";

      }


      const now =
        new Date();


      if(
        d.toDateString() ===
        now.toDateString()
      ){

        return d.toLocaleTimeString(
          [],
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        );

      }


      return d.toLocaleDateString(
        [],
        {
          day:"2-digit",
          month:"short"
        }
      );

    }

/* =================================
   USER PROFILE AVATAR
================================= */

function getUserAvatar(user) {

    const name =
        user.displayName ||
        user.username ||
        "User";

    const initial =
        name.charAt(0).toUpperCase();

    const avatar =
        user.avatar || "";

    if (
        avatar &&
        /^https?:\/\//i.test(avatar)
    ) {
        return `
            <img
                src="${escapeHTML(avatar)}"
                alt="${escapeHTML(name)}"
                style="
                    width:100%;
                    height:100%;
                    object-fit:cover;
                    border-radius:16px;
                    display:block;
                "
                onerror="
                    this.style.display='none';
                    this.parentElement.dataset.initial='${escapeHTML(initial)}';
                    this.parentElement.classList.add('avatar-fallback');
                "
            >
        `;
    }

    return escapeHTML(initial);
}
    
    /* =================================
       ESCAPE HTML
    ================================= */

    function escapeHTML(
      value
    ){

      return String(
        value ?? ""
      )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

    }
