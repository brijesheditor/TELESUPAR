<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>TELESUPAR Chat</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #080b12;
            color: #ffffff;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        /* =========================
           APP
        ========================= */

        .app {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(60, 90, 255, 0.12),
                    transparent 35%
                ),
                #080b12;
        }

        /* =========================
           HEADER
        ========================= */

        .chat-header {
            height: 64px;
            min-height: 64px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(14, 18, 28, 0.94);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            backdrop-filter: blur(18px);
            z-index: 10;
        }

        .back-btn,
        .header-menu-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: transparent;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .back-btn:active,
        .header-menu-btn:active {
            background: rgba(255,255,255,0.08);
        }

        .header-avatar {
            width: 43px;
            height: 43px;
            min-width: 43px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background:
                linear-gradient(
                    135deg,
                    #536dfe,
                    #8c52ff
                );
            font-size: 17px;
            font-weight: 700;
        }

        .header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-info {
            flex: 1;
            min-width: 0;
        }

        .chat-user-name {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .online-status {
            margin-top: 2px;
            font-size: 12px;
            color: #8d98aa;
            white-space: nowrap;
        }

        .online-status.online {
            color: #36d399;
        }

        /* =========================
           MESSAGES
        ========================= */

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 14px 12px 12px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.12);
            border-radius: 20px;
        }

        .empty-chat {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #727c8f;
            font-size: 14px;
            padding: 30px;
        }

        .message {
            display: flex;
            width: 100%;
            margin: 5px 0;
        }

        .message.incoming {
            justify-content: flex-start;
        }

        .message.outgoing {
            justify-content: flex-end;
        }

        .message-content {
            max-width: min(78%, 520px);
        }

        .message-bubble {
            position: relative;
            padding: 9px 11px 7px;
            border-radius: 15px;
            background: #171d29;
            color: #f5f7fb;
            box-shadow:
                0 4px 14px rgba(0,0,0,0.12);
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }

        .outgoing .message-bubble {
            background:
                linear-gradient(
                    135deg,
                    #3157d8,
                    #4d3cc9
                );
            border-bottom-right-radius: 5px;
        }

        .incoming .message-bubble {
            border-bottom-left-radius: 5px;
        }

        .message-text {
            font-size: 15px;
            line-height: 1.42;
            white-space: pre-wrap;
        }

        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 4px;
            min-height: 14px;
        }

        .message-time {
            font-size: 10px;
            color: rgba(255,255,255,0.56);
        }

        .message-status {
            font-size: 12px;
            line-height: 1;
            color: #aeb8ff;
        }

        /* =========================
           COMPOSER
        ========================= */

        .composer-area {
            position: relative;
            padding:
                7px
                9px
                calc(7px + env(safe-area-inset-bottom));
            background: rgba(10,14,22,0.96);
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        /* =========================
           ATTACHMENT MENU
        ========================= */

        .attachment-menu {
            display: none;
            position: absolute;
            left: 9px;
            bottom: 65px;
            width: 180px;
            padding: 7px;
            border-radius: 15px;
            background: #151b27;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow:
                0 14px 40px rgba(0,0,0,.4);
            z-index: 20;
        }

        .attachment-menu.show {
            display: block;
            animation: menuIn .16s ease;
        }

        @keyframes menuIn {

            from {
                opacity: 0;
                transform: translateY(8px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        .attachment-option {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px;
            border-radius: 10px;
            background: transparent;
            color: #e8ebf3;
            text-align: left;
            font-size: 14px;
        }

        .attachment-option:active {
            background: rgba(255,255,255,0.07);
        }

        .attachment-icon {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            background: rgba(126,140,255,0.12);
        }

        /* =========================
           MESSAGE FORM
        ========================= */

        .message-form {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .attach-btn,
        .send-btn {
            width: 43px;
            height: 43px;
            min-width: 43px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .attach-btn {
            background: #171d29;
            color: #b9c1d1;
            font-size: 24px;
        }

        .attach-btn:active {
            transform: scale(.94);
        }

        .message-input {
            flex: 1;
            min-width: 0;
            height: 43px;
            padding: 0 14px;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 22px;
            outline: none;
            background: #151b27;
            color: #ffffff;
            font-size: 14px;
        }

        .message-input::placeholder {
            color: #707a8e;
        }

        .message-input:focus {
            border-color: rgba(126,140,255,.42);
            background: #171e2b;
        }

        .send-btn {
            background:
                linear-gradient(
                    135deg,
                    #536dfe,
                    #7048e8
                );
            color: #ffffff;
            font-size: 19px;
            box-shadow:
                0 5px 18px rgba(83,109,254,.22);
        }

        .send-btn:active {
            transform: scale(.93);
        }

        .send-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        /* =========================
           FILE INPUT
        ========================= */

        #photoInput,
        #fileInput,
        #cameraInput {
            display: none;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .chat-header {
                height: 61px;
                min-height: 61px;
                padding: 7px 8px;
            }

            .back-btn,
            .header-menu-btn {
                width: 39px;
                height: 39px;
            }

            .header-avatar {
                width: 40px;
                height: 40px;
                min-width: 40px;
            }

            .messages {
                padding-left: 9px;
                padding-right: 9px;
            }

            .message-content {
                max-width: 84%;
            }

            .message-bubble {
                padding: 8px 10px 6px;
            }

            .message-text {
                font-size: 14px;
            }

            .composer-area {
                padding-left: 7px;
                padding-right: 7px;
            }

        }

    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         CHAT HEADER
    ========================== -->

    <header class="chat-header">

        <button
            id="backBtn"
            class="back-btn"
            type="button"
            aria-label="Back"
        >
            ‹
        </button>

        <div
            id="headerAvatar"
            class="header-avatar"
        >
            U
        </div>

        <div class="header-info">

            <div
                id="chatUserName"
                class="chat-user-name"
            >
                Loading...
            </div>

            <div
                id="onlineStatus"
                class="online-status"
            >
                Connecting...
            </div>

        </div>

        <button
            id="chatMenuBtn"
            class="header-menu-btn"
            type="button"
            aria-label="Chat menu"
        >
            ⋮
        </button>

    </header>


    <!-- =========================
         MESSAGES
    ========================== -->

    <main
        id="messages"
        class="messages"
    >

        <div class="empty-chat">
            Loading messages...
        </div>

    </main>


    <!-- =========================
         COMPOSER
    ========================== -->

    <section class="composer-area">

        <!-- ATTACHMENT MENU -->

        <div
            id="attachmentMenu"
            class="attachment-menu"
        >

            <button
                id="photoBtn"
                class="attachment-option"
                type="button"
            >
                <span class="attachment-icon">🖼️</span>
                <span>Photo</span>
            </button>

            <button
                id="fileBtn"
                class="attachment-option"
                type="button"
            >
                <span class="attachment-icon">📎</span>
                <span>File</span>
            </button>

            <button
                id="cameraBtn"
                class="attachment-option"
                type="button"
            >
                <span class="attachment-icon">📷</span>
                <span>Camera</span>
            </button>

        </div>


        <!-- HIDDEN FILE INPUTS -->

        <input
            id="photoInput"
            type="file"
            accept="image/*"
        >

        <input
            id="fileInput"
            type="file"
        >

        <input
            id="cameraInput"
            type="file"
            accept="image/*"
            capture="environment"
        >


        <!-- MESSAGE FORM -->

        <form
            id="messageForm"
            class="message-form"
        >

            <button
                id="attachmentBtn"
                class="attach-btn"
                type="button"
                aria-label="Attachments"
            >
                +
            </button>

            <input
                id="messageInput"
                class="message-input"
                type="text"
                autocomplete="off"
                placeholder="Write a message..."
                maxlength="5000"
            >

            <button
                id="sendBtn"
                class="send-btn"
                type="submit"
                aria-label="Send message"
            >
                <span>➤</span>
            </button>

        </form>

    </section>

</div>


<!-- =========================
     SOCKET.IO
========================== -->

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<!-- =========================
     CHAT JAVASCRIPT
========================== -->

<script src="js/chat.js?v=4"></script>

</body>
</html>
