<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TELESUPAR Chat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#070a0f;
    --panel:#0d1118;
    --panel2:#111722;
    --border:rgba(255,255,255,.07);
    --text:#f4f7fb;
    --muted:#8d98a8;
    --accent:#4f8cff;
    --accent2:#6b5cff;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(79,140,255,.16),
            transparent 35%
        ),
        #070a0f;

    color:var(--text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overflow:hidden;
}

/* =========================================
   APP
========================================= */

.chat-app{
    width:100%;
    max-width:700px;
    height:100dvh;

    margin:auto;

    display:flex;
    flex-direction:column;

    background:rgba(7,10,15,.97);

    overflow:hidden;
}

/* =========================================
   HEADER
========================================= */

.chat-header{
    height:70px;
    min-height:70px;

    flex-shrink:0;

    display:flex;
    align-items:center;

    gap:12px;

    padding:10px 14px;

    background:rgba(13,17,24,.94);

    border-bottom:
        1px solid var(--border);

    backdrop-filter:blur(20px);

    position:relative;
    z-index:20;
}

.back-btn{
    width:42px;
    height:42px;

    flex-shrink:0;

    border:0;
    border-radius:14px;

    background:#151b25;

    color:white;

    font-size:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.15s ease;
}

.back-btn:active{
    transform:scale(.93);
}

.avatar{
    width:43px;
    height:43px;

    flex-shrink:0;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:800;
    font-size:17px;

    background:
        linear-gradient(
            135deg,
            #4f8cff,
            #745cff
        );

    box-shadow:
        0 5px 20px
        rgba(79,140,255,.22);
}

.user-info{
    min-width:0;
    flex:1;
}

.user-name{
    font-size:16px;
    font-weight:750;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.online{
    margin-top:3px;

    color:#7f8a99;

    font-size:12px;

    transition:.2s ease;
}

.online.connected{
    color:#52d991;
}

.chat-menu{
    width:40px;
    height:40px;

    flex-shrink:0;

    border:0;
    border-radius:13px;

    background:transparent;

    color:#c8d0db;

    font-size:23px;

    cursor:pointer;
}

/* =========================================
   MESSAGES
========================================= */

.messages{
    flex:1;

    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;

    padding:
        18px
        13px
        34px;

    scroll-behavior:smooth;

    overscroll-behavior:contain;

    scrollbar-width:thin;
    scrollbar-color:#252d39 transparent;
}

.messages::-webkit-scrollbar{
    width:3px;
}

.messages::-webkit-scrollbar-thumb{
    background:#252d39;
    border-radius:10px;
}

.message{
    max-width:78%;

    margin:5px 0;

    display:flex;
    flex-direction:column;

    animation:
        messageIn .16s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(4px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.sent{
    margin-left:auto;
    align-items:flex-end;
}

.message.received{
    margin-right:auto;
    align-items:flex-start;
}

.message-bubble{
    padding:11px 14px;

    border-radius:17px;

    font-size:15px;
    line-height:1.45;

    word-break:break-word;
    white-space:pre-wrap;

    user-select:text;
}

.message.sent .message-bubble{
    background:
        linear-gradient(
            135deg,
            #3979f6,
            #5755dc
        );

    border-bottom-right-radius:5px;

    box-shadow:
        0 6px 18px
        rgba(56,102,235,.15);
}

.message.received .message-bubble{
    background:#151b24;

    border:
        1px solid
        rgba(255,255,255,.045);

    border-bottom-left-radius:5px;
}

.message-time{
    margin:4px 5px 0;

    color:#687384;

    font-size:10px;

    min-height:13px;
}

.message-status{
    margin-left:2px;

    font-size:12px;

    letter-spacing:-2px;

    color:#dce6f5;
}

/* =========================================
   EMPTY CHAT
========================================= */

.empty-chat{
    min-height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:#687384;

    font-size:13px;

    padding:30px;
}

/* =========================================
   COMPOSER
========================================= */

.composer-area{
    flex-shrink:0;

    position:relative;

    z-index:30;

    padding:
        0
        12px
        calc(
            14px +
            env(safe-area-inset-bottom)
        );

    background:
        linear-gradient(
            to top,
            #070a0f 78%,
            rgba(7,10,15,.92)
        );
}

.message-form{
    width:100%;
    min-height:58px;

    display:flex;
    align-items:center;

    gap:8px;

    padding:6px;

    background:#111722;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:21px;

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.45),

        inset 0 1px 0
        rgba(255,255,255,.025);
}

.attach-btn{
    width:43px;
    height:43px;

    flex-shrink:0;

    border:0;
    border-radius:14px;

    background:#1a212d;

    color:#b8c2d0;

    font-size:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.15s ease;
}

.attach-btn:active{
    transform:scale(.91);
}

.message-input{
    min-width:0;

    flex:1;

    height:44px;

    border:0;
    outline:none;

    background:transparent;

    color:#fff;

    font-size:15px;

    padding:0 4px;
}

.message-input::placeholder{
    color:#687384;
}

.send-btn{
    width:45px;
    height:45px;

    flex-shrink:0;

    border:0;
    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #4f8cff,
            #6358e8
        );

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 7px 20px
        rgba(79,140,255,.28);

    transition:.15s ease;
}

.send-btn span{
    font-size:21px;

    transform:translateX(1px);
}

.send-btn:active{
    transform:scale(.90);
}

.send-btn:disabled{
    opacity:.55;
    cursor:default;
}

/* =========================================
   ATTACHMENT MENU
========================================= */

.attachment-menu{
    display:none;

    margin:
        0
        4px
        9px;

    padding:10px;

    background:#121823;

    border:
        1px solid
        var(--border);

    border-radius:18px;

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.35);

    animation:
        menuIn .15s ease;
}

.attachment-menu.show{
    display:flex;
    gap:8px;
}

@keyframes menuIn{

    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.attach-option{
    flex:1;

    min-height:54px;

    border:0;

    border-radius:14px;

    background:#1a212c;

    color:#dbe2ec;

    font-size:12px;

    cursor:pointer;
}

.attach-option:active{
    transform:scale(.96);
}

.attach-option strong{
    display:block;

    font-size:20px;

    margin-bottom:3px;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:480px){

    .chat-header{
        height:66px;
        min-height:66px;

        padding:
            9px
            11px;
    }

    .messages{
        padding:
            14px
            10px
            34px;
    }

    .message{
        max-width:82%;
    }

    .message-bubble{
        font-size:14px;
    }

    .composer-area{
        padding-left:8px;
        padding-right:8px;

        padding-bottom:
            calc(
                12px +
                env(safe-area-inset-bottom)
            );
    }

    .message-form{
        min-height:57px;

        border-radius:19px;
    }

    .attach-btn{
        width:42px;
        height:42px;
    }

    .send-btn{
        width:44px;
        height:44px;

        border-radius:15px;
    }
}

/* =========================================
   VERY SMALL SCREEN
========================================= */

@media(max-height:650px){

    .chat-header{
        height:62px;
        min-height:62px;
    }

    .messages{
        padding-top:10px;
    }

    .composer-area{
        padding-bottom:
            calc(
                8px +
                env(safe-area-inset-bottom)
            );
    }
}

</style>
</head>

<body>

<div class="chat-app">

    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="chat-header">

        <button
            id="backBtn"
            class="back-btn"
            type="button"
            aria-label="Back">
            ‹
        </button>

        <div
            id="headerAvatar"
            class="avatar">
            ?
        </div>

        <div class="user-info">

            <div
                id="chatUserName"
                class="user-name">
                Chat
            </div>

            <div
                id="onlineStatus"
                class="online">
                Connecting...
            </div>

        </div>

        <button
            id="chatMenuBtn"
            class="chat-menu"
            type="button"
            aria-label="Chat menu">
            ⋮
        </button>

    </header>


    <!-- =====================================
         MESSAGES
    ====================================== -->

    <main
        id="messages"
        class="messages">

        <div class="empty-chat">
            Loading messages...
        </div>

    </main>


    <!-- =====================================
         COMPOSER
    ====================================== -->

    <section class="composer-area">

        <!-- ATTACHMENT MENU -->

        <div
            id="attachmentMenu"
            class="attachment-menu">

            <button
                id="photoBtn"
                class="attach-option"
                type="button">

                <strong>▧</strong>
                Photo

            </button>

            <button
                id="fileBtn"
                class="attach-option"
                type="button">

                <strong>▤</strong>
                File

            </button>

            <button
                id="cameraBtn"
                class="attach-option"
                type="button">

                <strong>◉</strong>
                Camera

            </button>

        </div>


        <!-- MESSAGE FORM -->

        <form
            id="messageForm"
            class="message-form">

            <button
                id="attachmentBtn"
                class="attach-btn"
                type="button"
                aria-label="Attachment">
                +
            </button>

            <input
                id="messageInput"
                class="message-input"
                type="text"
                autocomplete="off"
                placeholder="Write a message..."
                maxlength="5000"
            >

            <button
                id="sendBtn"
                class="send-btn"
                type="submit"
                aria-label="Send">

                <span>➤</span>

            </button>

        </form>

    </section>

</div>


<!-- =========================================
     SOCKET.IO
========================================= -->

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<!-- v2 = force fresh JS -->
<script src="js/chat.js?v=2"></script>

</body>
</html>
